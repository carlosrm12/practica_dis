name: CI/CD Pipeline (QA & Main)

on:
  push:
    branches: 
      - main
      - qa
    paths:
      - 'infra/**'    # Se activa si modificas la infraestructura
      - 'app/**'      # Se activa si modificas el código de la app
      - '.github/workflows/**'
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: read

jobs:
  terraform:
    name: 'Deploy Infra & App'
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Define la carpeta donde está tu main.tf
    defaults:
      run:
        working-directory: ./infra

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
        # Token de Terraform Cloud (Configurado en GitHub Secrets)
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init
      env:
        TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    - name: Select Workspace
      id: workspace
      run: |
        # 1. Detectamos la rama (main o qa)
        BRANCH_NAME="${{ github.ref_name }}"
        echo "Rama detectada: $BRANCH_NAME"
        
        # 2. Seleccionamos (o creamos) el workspace con el mismo nombre de la rama
        terraform workspace select $BRANCH_NAME || terraform workspace new $BRANCH_NAME
        
        # 3. Definimos el nombre del ASG esperado según la lógica de tu main.tf
        # En main.tf debes tener: name = "asg-${terraform.workspace}"
        echo "ASG_NAME=asg-$BRANCH_NAME" >> $GITHUB_ENV

    - name: Terraform Apply
      # Pasamos el hash del commit para forzar la actualización del Launch Template
      run: terraform apply -auto-approve -var="commit_hash=${{ github.sha }}"
      env:
        TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        # Credenciales AWS para que el runner pueda ejecutar comandos (si es necesario)
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }} # Solo si usas AWS Academy
        AWS_REGION: us-east-1

    - name: Instance Refresh (Zero Downtime)
      # Script "Smart Wait" para rotar las instancias automáticamente
      run: |
        ASG_NAME="${{ env.ASG_NAME }}"
        echo "Iniciando gestión de refresco para: $ASG_NAME"

        # A. Cancelar cualquier refresco anterior que se haya quedado trabado
        aws autoscaling cancel-instance-refresh --auto-scaling-group-name $ASG_NAME || true
        
        # B. Esperar a que el ASG esté libre
        echo "Verificando estado del ASG..."
        while true; do
          STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name $ASG_NAME \
            --query 'InstanceRefreshes[0].Status' \
            --output text 2>/dev/null || echo "None") # Si falla el comando (ej: ASG nuevo), asume None
            
          echo "Estado actual: $STATUS"
          
          if [ "$STATUS" == "None" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "Successful" ] || [ "$STATUS" == "Failed" ]; then
            echo "¡El ASG está listo para actualizarse!"
            break
          fi
          
          echo "ASG ocupado... esperando 5 segundos..."
          sleep 5
        done
        
        # C. Iniciar el refresco (Rotación de instancias)
        echo "Lanzando Instance Refresh..."
        aws autoscaling start-instance-refresh \
          --auto-scaling-group-name $ASG_NAME \
          --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}'
      
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        AWS_REGION: us-east-1